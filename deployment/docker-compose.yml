# Self-host the whole stack: static site + API.
# Run from repo root:  docker compose -f deployment/docker-compose.yml up -d --build
services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
      args:
        BASE_PATH: ${BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        SITE_URL: ${SITE_URL:-https://hgh.dev}
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    ports:
      - "8787:8787"
    environment:
      # Pulled from host env / a .env file beside this compose file.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_ID: ${STEAM_ID:-}
      DISCORD_ID: ${DISCORD_ID:-}
      LINKEDIN_URL: ${LINKEDIN_URL:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_TOKEN_SECRET: ${MAIL_TOKEN_SECRET:-}
      API_DATA_DIR: /data
      API_CACHE_MAX_BYTES: ${API_CACHE_MAX_BYTES:-268435456}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:-}
      CACHE_VERSION: ${CACHE_VERSION:-1}
    restart: unless-stopped
    volumes:
      - api-data:/data

volumes:
  api-data:
