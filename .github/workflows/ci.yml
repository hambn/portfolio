name: CI

on:
  pull_request:
  # Also run on main, so a merge that breaks a check shows up there instead
  # of surfacing later as a failure on every unrelated PR.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # Both images build from the repo root; a workspace missing from a
  # Dockerfile's package.json copies only shows up here.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/web/Dockerfile -t portfolio-web .
      - run: docker build -f apps/api/Dockerfile -t portfolio-api .

  # Dependabot can only open PRs, so land them for it: once both jobs above
  # pass, squash-merge into main. A merge made with GITHUB_TOKEN does not fire
  # push workflows, so the deploy is dispatched explicitly.
  dependabot-merge:
    needs: [check, images]
    # Keyed on the PR author, not github.actor, so a manual re-run of a
    # Dependabot PR's checks still merges it once they pass.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Merge only the commit these checks ran on: a push that lands on the
      # branch after them is refused instead of merged untested.
      - run: >-
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
          --match-head-commit "${{ github.event.pull_request.head.sha }}"
      - run: gh workflow run deploy.yml --ref main
