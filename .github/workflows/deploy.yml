name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [build, deploy-worker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run api:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOTIFY_KV_ID: ${{ secrets.SPOTIFY_KV_ID }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          DISCORD_ID: ${{ secrets.DISCORD_ID }}
          LINKEDIN_URL: ${{ secrets.LINKEDIN_URL }}
      - name: Push worker secrets
        run: |
          jq -n \
            --arg client_id "$SPOTIFY_CLIENT_ID" \
            --arg refresh_token "$SPOTIFY_REFRESH_TOKEN" \
            --arg steam_key "$STEAM_API_KEY" \
            --arg mail_key "$MAIL_API_KEY" \
            --arg mail_token_secret "$MAIL_TOKEN_SECRET" \
            '{SPOTIFY_CLIENT_ID: $client_id, SPOTIFY_REFRESH_TOKEN: $refresh_token, STEAM_API_KEY: $steam_key, MAIL_API_KEY: $mail_key, MAIL_TOKEN_SECRET: $mail_token_secret}' \
            | npx wrangler secret bulk --config api/wrangler.gen.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          # Signs the contact form's single-use tokens. Changing it only
          # invalidates forms that are open at that moment.
          MAIL_TOKEN_SECRET: ${{ secrets.MAIL_TOKEN_SECRET }}
