name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy:
    needs: build
    # A manual run can target any branch; only main reaches production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare
      url: https://hgh.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy unified Worker + static assets
        run: npm run api:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOTIFY_KV_ID: ${{ secrets.SPOTIFY_KV_ID }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          DISCORD_ID: ${{ secrets.DISCORD_ID }}
          LINKEDIN_URL: ${{ secrets.LINKEDIN_URL }}
      - name: Push worker secrets
        run: |
          # An unset repository secret is skipped rather than written as an
          # empty value, which would wipe one set by hand with wrangler.
          jq -n \
            --arg client_id "$SPOTIFY_CLIENT_ID" \
            --arg refresh_token "$SPOTIFY_REFRESH_TOKEN" \
            --arg steam_key "$STEAM_API_KEY" \
            --arg mail_key "$MAIL_API_KEY" \
            --arg mail_token_secret "$MAIL_TOKEN_SECRET" \
            --arg github_token "$PROJECTS_GITHUB_TOKEN" \
            '{SPOTIFY_CLIENT_ID: $client_id, SPOTIFY_REFRESH_TOKEN: $refresh_token, STEAM_API_KEY: $steam_key, MAIL_API_KEY: $mail_key, MAIL_TOKEN_SECRET: $mail_token_secret, GITHUB_TOKEN: $github_token} | with_entries(select(.value != ""))' \
            | npx wrangler secret bulk --config apps/api/wrangler.gen.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          # Signs the contact form's single-use tokens. Changing it only
          # invalidates forms that are open at that moment.
          MAIL_TOKEN_SECRET: ${{ secrets.MAIL_TOKEN_SECRET }}
          # Optional. Actions reserves the GITHUB_ prefix for its own secrets,
          # so the repository secret is named PROJECTS_GITHUB_TOKEN.
          PROJECTS_GITHUB_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
      - name: Clean up legacy Pages project & sync Worker custom domains
        run: |
          set -euo pipefail
          DOMAIN="${CLOUDFLARE_DOMAIN:-hgh.dev}"
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          # 1. Remove the old separate Cloudflare Pages project if it still exists
          #    so hgh.dev / www.hgh.dev are free and Workers & Pages shows one app.
          del=$(curl -sS -X DELETE "${API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/portfolio" "${AUTH[@]}")
          if [ "$(echo "$del" | jq -r '.success')" = "true" ]; then
            echo "Deleted legacy Cloudflare Pages project 'portfolio'"
          else
            echo "Legacy Pages project already removed or inaccessible: $(echo "$del" | jq -c '.errors')"
          fi

          # 2. Attach hgh.dev and www.hgh.dev as Custom Domains on the unified Worker
          zone_res=$(curl -sS "${API}/zones?name=${DOMAIN}" "${AUTH[@]}")
          ZONE_ID=$(echo "$zone_res" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::notice::Could not look up Cloudflare zone for ${DOMAIN}; add ${DOMAIN} and www.${DOMAIN} under Workers & Pages -> portfolio -> Settings -> Domains & Routes."
            exit 0
          fi

          for host in "$DOMAIN" "www.$DOMAIN"; do
            payload=$(jq -n --arg host "$host" --arg zid "$ZONE_ID" \
              '{environment:"production",hostname:$host,service:"portfolio",zone_id:$zid}')
            res=$(curl -sS -X PUT "${API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" "${AUTH[@]}" --data "$payload")
            if [ "$(echo "$res" | jq -r '.success')" = "true" ]; then
              echo "Attached Worker custom domain ${host} -> portfolio"
            else
              echo "::warning::Could not attach Worker custom domain ${host}: $(echo "$res" | jq -c '.errors')"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DOMAIN: ${{ vars.CLOUDFLARE_DOMAIN }}
