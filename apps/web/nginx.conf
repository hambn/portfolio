# Cache policy. Vite emits content-hashed files under /assets/ (immutable);
# HTML/XML/JSON revalidate so a deploy goes live immediately.
map $uri $cache_control {
  default                     "public, max-age=600";
  ~^/([^/]+/)?assets/         "public, max-age=31536000, immutable";
  ~^/([^/]+/)?$               "no-cache";
  ~*\.(html|xml|json)$        "no-cache";
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Directory redirects (/blog -> /blog/) stay relative, so they keep the
  # published port and the scheme of whatever terminates TLS in front.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml application/rss+xml image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Prerendered routes are real dirs (/blog/, /resume/...). Unknown deep links
  # get 404.html with a real 404 status, which boots the SPA — same as GitHub
  # Pages.
  error_page 404 /404.html;
  location /api/ {
    # Resolve the api container at request time through Docker's DNS, so a
    # recreated container with a new address is picked up without a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8787;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Overwritten, never appended: the API trusts this header for the sender's
    # address (API_CLIENT_IP_HEADER in compose).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 90s;
    proxy_buffering off;
    # Defining a header here prevents inheritance of the static cache policy,
    # so the other security headers are repeated.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
