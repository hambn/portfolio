      property="og:description"
      content="DevOps engineer — infrastructure, virtualization, networking, containers, CI/CD, monitoring, and the tooling around them."

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "hamed ghasempour",
        "alternateName": "hambn",
        "jobTitle": "DevOps Engineer",
        "sameAs": [
          "https://github.com/hambn",
          "https://x.com/hambn4",
          "https://t.me/ham_bn",
          "https://linkedin.com/in/hambn"
        ]
      }
    </script>

    <style>
      body {
        margin: 0;
      }
      a {
        text-decoration: none;
      }
      * {
        box-sizing: border-box;
      }
    </style>

    <!-- Apply the saved theme and collapsed link cards before first paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hambn-theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
          // Link cards collapsed on a previous visit (see src/lib/cardState.js).
          var collapsed = [];
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            var card = /^(.+)_card_collapsed$/.exec(key || '');
            if (card && localStorage.getItem(key) === '1') collapsed.push(card[1]);
          }
          if (collapsed.length)
            document.documentElement.setAttribute('data-collapsed', collapsed.join(' '));
        } catch (e) {}
      })();
    </script>

    <!-- If a deploy removes a cached hashed entry chunk, recover on a normal reload. -->
    <script>
      (function () {
        var marker = '__asset_reload';
        var current = new URL(window.location.href);
        if (current.searchParams.has(marker)) return;
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (
              !target ||
              target.tagName !== 'SCRIPT' ||
              !target.src ||
              !target.src.includes('/assets/')
            )
              return;
            var next = new URL(window.location.href);
            next.searchParams.set(marker, String(Date.now()));
            window.location.replace(next.href);
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
